name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -n "$root" ] && [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMGR="$root/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found; ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests + release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bike-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
