name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_CONFIGURED: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужна история и теги, чтобы собрать список изменений между релизами

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -n "$root" ] && [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMGR="$root/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found; ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > android/release-key.jks
          printf 'storeFile=android/release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > android/key.properties
          keytool -list -keystore android/release-key.jks -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" > /dev/null
          echo "Release signing configured for alias $SIGNING_KEY_ALIAS"

      - name: Signing fallback notice
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          echo "KEYSTORE_BASE64 secret is not set: the release APK will use the debug signing config."

      - name: Unit tests + release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bike-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Предыдущий релиз по номеру версии (тег vX.Y.Z)
          PREV=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log --no-merges --pretty=format:'- %s' "${PREV}..${TAG}")
          else
            CHANGES='- Первый релиз.'
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES='- Мелкие правки и исправления.'
          fi

          # Человекочитаемое имя файла APK, как в прошлых релизах
          cp app/build/outputs/apk/release/app-release.apk "BikeGrid-$VERSION-release.apk"

          cat > release-body.md <<EOF
          BikeGrid $VERSION
          Велокомпьютер с записью тренировок, картой, BLE-датчиками и анализом результатов.

          Что нового в $VERSION
          $CHANGES

          Возможности приложения

          • Трекинг: велосипед, бег, ходьба; скорость, дистанция, время, набор высоты; автопауза, круги, восстановление тренировки.
          • Карта и маршруты: osmdroid, офлайн-кэш тайлов, импорт GPX/FIT, навигация, предупреждение о сходе с маршрута, профиль высоты.
          • Датчики: BLE пульс, скорость/каденс, мощность, RSC, велостанки по FTMS (ERG/Resistance), автопереподключение.
          • Планы тренировок: редактор, библиотека, импорт .ZWO, плеер шагов с целевыми зонами.
          • Аналитика: графики, зоны пульса и мощности, NP/IF/TSS, калории, круги, история тренировок.
          • Обмен: экспорт GPX/TCX/FIT, Health Connect (импорт и экспорт), бэкап/восстановление в JSON, отправка сводки на часы.
          • Приватность: без регистрации, данные хранятся на устройстве; разрешения запрашиваются по шагам с пояснениями.

          Установка

          Скачайте BikeGrid-$VERSION-release.apk ниже, разрешите установку из неизвестных источников и откройте файл. Минимальная версия Android — 9 (API 28).
          При обновлении данные сохраняются, если APK подписан тем же ключом, что и предыдущая версия.

          Проверки релиза

          Сборка assembleRelease и тесты testDebugUnitTest в CI: успешно.
          EOF

      - name: Remove legacy APK asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "${GITHUB_REF_NAME}" app-release.apk --yes || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BikeGrid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: BikeGrid-*.apk
          fail_on_unmatched_files: true
