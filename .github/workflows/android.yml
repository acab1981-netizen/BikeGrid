name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_CONFIGURED: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -n "$root" ] && [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMGR="$root/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found; ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > android/release-key.jks
          printf 'storeFile=android/release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > android/key.properties
          keytool -list -keystore android/release-key.jks -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" > /dev/null
          echo "Release signing configured for alias $SIGNING_KEY_ALIAS"

      - name: Signing fallback notice
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          echo "KEYSTORE_BASE64 secret is not set: the release APK will use the debug signing config."

      - name: Unit tests + release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bike-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BikeGrid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
