name: One-click release

# Запуск: Actions -> One-click release -> Run workflow -> ввести версию (например, 1.0.9).
# Воркфлоу сам поднимет versionCode/versionName, создаст коммит и тег vX.Y.Z и запушит их.
# По тегу android.yml соберёт APK и создаст GitHub Release с прикреплённым APK.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Новая версия, например 1.0.9'
        required: true
        type: string
  # Пуш ветки notes/vX.Y.Z обновляет текст уже существующего релиза (без пересоздания тега)
  push:
    branches: ['notes/**']

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Если main защищён, задайте секрет RELEASE_TOKEN с правами на push.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Bump version, commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.0.9" >&2
            exit 1
          fi
          FILE=app/build.gradle.kts
          OLD_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE")
          NEW_CODE=$((OLD_CODE + 1))
          sed -i -E "s/versionCode *= *[0-9]+/versionCode = $NEW_CODE/" "$FILE"
          sed -i -E "s/versionName *= *\"[^\"]*\"/versionName = \"$VERSION\"/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          echo "Готово: v$VERSION запушен. Android CI соберёт APK и опубликует релиз."

  # Обновление текста релиза, если тег уже есть и его нельзя удалить (repository rule)
  fix-notes:
    if: startsWith(github.ref, 'refs/heads/notes/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update existing release notes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${BRANCH#notes/}"
          bash .github/scripts/release-notes.sh "$TAG"
          gh release edit "$TAG" --title "BikeGrid ${TAG#v}" --notes-file release-body.md
          echo "Текст релиза $TAG обновлён."
